server:
  # H5 vite proxy: /api -> http://localhost:18080
  port: 18080

spring:
  application:
    name: application-user
  datasource:
    # TODO: 按实际环境修改数据库连接信息
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/parking?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  # 实体类别名包
  type-aliases-package: com.cyyaw.application.parking.entity.user
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，生产环境请关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置：secret 必须 >= 32 字节（HS256 要求）
jwt:
  secret: cyyaw-parking-jwt-secret-please-change-in-prod-32bytes
  # access token 有效期（秒），默认 2 小时
  access-expire: 7200
  # refresh token 有效期（秒），默认 7 天
  refresh-expire: 604800

# 验证码配置
verify:
  # 验证码有效期（秒）
  expire-seconds: 300
