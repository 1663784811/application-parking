server:
  port: 18080


spring:
  application:
    name: parking-gate


gate:
  jwt:
    # HS256 要求密钥 >= 32 字节，生产环境务必修改
    secret: cyyaw-parking-gate-jwt-secret-key-2026-change-in-production
    # token 有效期（秒），默认 24 小时
    expire: 86400
  # 保安亭登录用户（无数据库，账号密码写在此文件）
  users:
    - id: 1
      username: admin
      password: "123456"
      name: 管理员李明
      role: admin
      phone: "13800138000"
      parkingName: 城西停车场
      parkingId: 1
    - id: 2
      username: guard
      password: "123456"
      name: 值守员张三
      role: guard
      phone: "13800138888"
      parkingName: 城西停车场
      parkingId: 1


# MQTT 客户端（保安亭与设备/云端通信，参考 saas-mqtt）
# enabled=false 时不连接、不影响应用启动；需要时改为 true 并配置 tcp 服务器地址
cyyaw:
  mqtt:
    enabled: true
    timeOut: 1000
    defaultQos: 1
    topics:
      - aaaaaaa
      - cxccccc
    broker:
      - url: tcp://127.0.0.1:1883
        username: admin
        password: 123456
        clientId: sssddd

