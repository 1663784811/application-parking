server:
  port: 18080
#  servlet:
#    context-path: /api


spring:
  application:
    name: parking-gate

# admin 服务地址（车辆通行记录等内部接口调用；/internal/** 在 admin 放行）
admin:
  api:
    base-url: http://127.0.0.1:10000/api

gate:
  jwt:
    # HS256 要求密钥 >= 32 字节，生产环境务必修改
    secret: cyyaw-parking-gate-jwt-secret-key-2026-change-in-production
    # token 有效期（秒），默认 24 小时
    expire: 86400
  # 保安亭登录用户（无数据库，账号密码写在此文件）
  users:
    - id: 1
      username: admin
      password: "123456"
      name: 管理员李明
      role: admin
      phone: "13800138000"
      parkingName: 城西停车场
      parkingId: 1
    - id: 2
      username: guard
      password: "123456"
      name: 值守员张三
      role: guard
      phone: "13800138888"
      parkingName: 城西停车场
      parkingId: 1
  # 车牌识别：第一步图片落地目录、MQTT 发布端 clientId（须与 cyyaw 订阅端不同）
  plate:
    image-dir: ./data/plate-img
    publisher-client-id: parking-gate-publisher


# MQTT 客户端（保安亭与设备/云端通信，参考 saas-mqtt）
# enabled=false 时不连接、不影响应用启动；需要时改为 true 并配置 tcp 服务器地址
cyyaw:
  mqtt:
    topics:
      - aaaaaaa
      - cxccccc
    broker:
      - url: tcp://127.0.0.1:1883
        username: admin
        password: 123456
        clientId: WG001


netty:
  mqtt:
    name: Node1
    tcp-port: 11883
    web-port: 38083
    web-path: /mqtt