<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>正在进入</title>
    <style>
      /* 本页刻意不引 Vue / 依赖 axios：它是微信/支付宝回跳的第一落点，
         要做到零依赖、秒开，所以颜色直接写死（与 variables.css 的主色一致） */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
        background: #fff;
        color: #6b7280;
      }
      .box {
        padding: 0 32px;
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 16px;
        border: 3px solid #d1fae5;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .tip {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner" id="spinner"></div>
      <p class="tip" id="tip">正在进入…</p>
    </div>

    <script>
      /*
       * 授权分发页 + 授权回跳中转页（流程见 微信H5授权流程.md）。
       *
       * 它有两种身份，靠 URL 里有没有 code / auth_code 区分：
       *
       * ① 入口（被扫码/链接打开）：判断当前环境决定去哪拿身份
       *      微信内   → 静默授权（snsapi_base，不弹窗）
       *      支付宝内 → 静默授权（auth_base，不弹窗）
       *      普通浏览器 → 直接回 SPA 的登录页（没法自动拿身份）
       *
       * ② 回跳（平台带凭证回来）：微信回 code、支付宝回 auth_code，
       *    本页把它从 query 搬进 hash 交给 SPA 去换登录态 —— 换 token 要 secret，只能后端做。
       *
       * 入参（平铺，二维码/链接生成端好拼）：
       *      oauth.html?appId=1&path=/app/1/scanExit&parkingId=123&channelId=456
       *    - appId 必填；path 缺省落到 scanExit；其余参数原样带进目标路由
       *
       * 授权往返靠 state 带上下文（redirect_uri 是固定地址，业务参数只能走 state），
       * state 里存的就是拼好的目标路由，回跳时原样取回。
       */
      (function () {
        // 后端登录接口前缀，与 src/api/thirdAuth.js 保持一致
        var API_BASE = '%VITE_BASE_URL%/api/app/login';
        var DEFAULT_PATH_SUFFIX = '/scanExit';

        var query = new URLSearchParams(window.location.search);
        var tip = document.getElementById('tip');

        function fail(msg) {
          document.getElementById('spinner').classList.add('hidden');
          tip.textContent = msg;
        }

        function sep(url) {
          return url.indexOf('?') === -1 ? '?' : '&';
        }

        // 把目标路由交给 SPA（带上平台给的凭证）
        function toSpa(target, paramName, value) {
          window.location.replace('./#' + target + sep(target) + paramName + '=' + encodeURIComponent(value));
        }

        // ===== ② 回跳 =====
        var wechatCode = query.get('code');
        var alipayCode = query.get('auth_code');
        if (wechatCode || alipayCode) {
          // URLSearchParams 已经解过一层；平台侧那次编码是后端加的，这里不用再动
          var target = query.get('state');
          if (!target) {
            fail('授权参数不完整，请重新扫码进入');
            return;
          }
          if (target.charAt(0) !== '/') {
            target = '/' + target;
          }
          if (wechatCode) {
            toSpa(target, 'code', wechatCode);
          } else {
            // 支付宝回跳带的是 auth_code，换个参数名进 SPA，两边才好区分
            toSpa(target, 'auth_code', alipayCode);
          }
          return;
        }

        // ===== ① 入口 =====
        var appId = query.get('appId');
        if (!appId) {
          fail('缺少 appId 参数，请重新扫码进入');
          return;
        }

        // 目标路由：path + 除 appId/path 外的业务参数
        var path = query.get('path') || '/app/' + appId + DEFAULT_PATH_SUFFIX;
        var rest = new URLSearchParams();
        query.forEach(function (value, key) {
          if (key !== 'appId' && key !== 'path') {
            rest.append(key, value);
          }
        });
        var restStr = rest.toString();
        var targetRoute = restStr ? path + sep(path) + restStr : path;

        var ua = navigator.userAgent;
        var inWechat = /MicroMessenger/i.test(ua);
        var inAlipay = /AlipayClient/i.test(ua);

        // redirectUri 固定指回本页：平台只会追加 code/auth_code&state，业务参数走 state
        var redirectUri = window.location.origin + window.location.pathname;

        function authUrl(api) {
          // state 传的是明文目标路由：后端拿到后会自己编码再拼进授权链接
          // （微信那边 state 是不编码直接拼的，这层防线在后端）
          return (
            API_BASE +
            api +
            '?appId=' + encodeURIComponent(appId) +
            '&redirectUri=' + encodeURIComponent(redirectUri) +
            '&state=' + encodeURIComponent(targetRoute)
          );
        }

        function jump(url) {
          // 后端返回 { code:2000, data:"https://..." } 的信封
          return fetch(url)
            .then(function (res) {
              return res.json();
            })
            .then(function (body) {
              if (!body || body.code !== 2000 || !body.data) {
                throw new Error((body && body.msg) || '获取授权链接失败');
              }
              window.location.href = body.data;
            })
            .catch(function (err) {
              fail(err && err.message ? err.message : '网络异常，请稍后重试');
            });
        }

        if (inAlipay) {
          // 支付宝静默授权（auth_base），只拿 user_id
          jump(authUrl('/alipayAuthUrl'));
        } else if (inWechat) {
          // 微信静默授权（snsapi_base），只拿 openid
          jump(authUrl('/wechatMpAuthUrl'));
        } else {
          // 普通浏览器没法自动拿平台身份，回 SPA 走手机验证码登录
          window.location.replace('./#/app/' + appId + '/login');
        }
      })()
    </script>
  </body>
</html>
