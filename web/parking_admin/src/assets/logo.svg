<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 停车位背景 -->
  <rect x="8" y="16" width="48" height="36" rx="4" fill="url(#grad1)" />
  <!-- P 字样 -->
  <text x="32" y="44" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">P</text>
  <!-- 边框装饰 -->
  <rect x="8" y="16" width="48" height="36" rx="4" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4 2" />
</svg>